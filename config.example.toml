# 复制为 config.toml 后按需修改；命令行参数优先级高于本文件。

# 网易云歌单 ID（公开歌单）。歌单链接形如：
# https://music.163.com/playlist?id=16610553  →  16610553
playlist_id = ""

# 输出目录：本地路径或 NAS 共享（UNC）
# Windows 示例："D:/Music"  或  "//nas/Musics"
# Linux/macOS 示例："/mnt/nas/Musics"
dest = "./output"

# 工作目录：songs.json、state.json、manifest.csv 都放在这里
work_dir = "./work"

# 并发线程数
workers = 4

# 文件名模板，必须包含 {name}；可用变量：{name} {artists} {album} {id}
naming = "{name} - {artists}"

# 只处理前 N 首（调试用），留空表示全部
# limit = 10

# ffprobe 路径（用于校验时长）。未安装时可改为 "ffprobe"，校验会自动跳过
ffprobe = "ffprobe"

# 单次网络请求超时（秒）
timeout = 90

# 上传失败重试次数
retries = 2
